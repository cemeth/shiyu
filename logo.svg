  <!-- 书页中线 -->
  <line x1="23" y1="9" x2="23" y2="37" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>
  <!-- 三条语言波纹 -->
  <line x1="14" y1="17" x2="20" y2="17" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
  <line x1="12" y1="23" x2="20" y2="23" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
  <line x1="13" y1="29" x2="20" y2="29" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity=".2"/>
