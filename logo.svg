  <path d="M32 14 C25 10.5, 13 12, 11 20 C9 28, 15 35, 24 34 C30 33.2, 34 29.5, 34.5 25"
        stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
